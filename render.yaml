services:
  - type: web
    name: findmyway-backend-shanu9540
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: ACCOMMODATION_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: findmyway-db-shanu9540
          property: connectionString

  - type: web
    name: findmyway-frontend-shanu9540
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://findmyway-backend-shanu9540.onrender.com/api

databases:
  - name: findmyway-db-shanu9540
    plan: free
