services:
  - type: web
    name: findmyway-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DUFFEL_ACCESS_TOKEN
        value: duffel_test_YOUR_TEST_TOKEN_HERE
      - key: ACCOMMODATION_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: findmyway-db
          property: connectionString

databases:
  - name: findmyway-db
    plan: free
